<script>
        // Simple Interaction Logic
        const options = document.querySelectorAll('.option-btn');
        const checkBtn = document.getElementById('checkBtn');
        let selectedOption = null;

        options.forEach(option => {
            option.addEventListener('click', () => {
                // Reset others
                options.forEach(o => {
                    o.classList.remove('border-primary', 'bg-primary-fixed/20');
                    o.classList.add('border-surface-container-high');
                });
                
                // Select this one
                option.classList.remove('border-surface-container-high');
                option.classList.add('border-primary', 'bg-primary-fixed/20');
                selectedOption = option;

                // Enable Check Button
                checkBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                checkBtn.classList.add('bg-primary', 'text-on-primary', 'cursor-pointer', 'shadow-md');
                checkBtn.removeAttribute('disabled');
            });
        });

        // Play Button Animation Logic
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            const icon = playBtn.querySelector('.material-symbols-outlined');
            if (isPlaying) {
                icon.innerText = 'pause';
                // Simulate progress bar move
                const bar = document.querySelector('.bg-primary.h-full'); // Progress on top bar? No, audio bar
                const audioBar = document.querySelector('.bg-outline-variant > .bg-primary');
                const audioHandle = document.querySelector('.group-hover\\:block');
                
                let progress = 0;
                const interval = setInterval(() => {
                    if (progress >= 100 || !isPlaying) {
                        clearInterval(interval);
                        if(progress >= 100) {
                            isPlaying = false;
                            icon.innerText = 'play_arrow';
                        }
                    } else {
                        progress += 1;
                        audioBar.style.width = progress + '%';
                    }
                }, 30);
            } else {
                icon.innerText = 'play_arrow';
            }
        });
    </script>
