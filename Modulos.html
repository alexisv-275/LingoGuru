<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LingoGuru Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style data-purpose="custom-styles">
    /* Custom focus styles for high contrast accessibility */
    .focus-ring:focus-visible {
      outline: 4px solid #2563eb; /* Tailwind blue-600 */
      outline-offset: 2px;
    }
  </style>
</head>
<body class="bg-[#f4f5f8] min-h-screen font-sans text-gray-800">
<!-- BEGIN: MainHeader -->
<header class="bg-white px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-10" data-purpose="top-nav-bar">
<!-- Logo Section -->
<div class="flex items-center gap-3">
<div aria-hidden="true" class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-2xl">
<i class="fa-solid fa-owl"></i>
</div>
<h1 class="text-xl font-bold tracking-tight">LingoGuru</h1>
</div>
<!-- Navigation Icons -->
<nav aria-label="Main Navigation">
<ul class="flex items-center gap-6 text-gray-600 text-xl">
<li>
<a aria-label="Help" class="hover:text-blue-600 transition-colors focus-ring rounded-full p-1 block" href="#">
<i class="fa-regular fa-circle-question"></i>
</a>
</li>
<li>
<a aria-label="Home" class="hover:text-blue-600 transition-colors focus-ring rounded-full p-1 block" href="#">
<i class="fa-solid fa-house"></i>
</a>
</li>
<li>
<a aria-label="Settings" class="hover:text-blue-600 transition-colors focus-ring rounded-full p-1 block" href="#">
<i class="fa-solid fa-gear"></i>
</a>
</li>
<li>
<a aria-label="User Profile" class="hover:text-blue-600 transition-colors focus-ring rounded-full p-1 block" href="#">
<i class="fa-regular fa-circle-user"></i>
</a>
</li>
</ul>
</nav>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="max-w-6xl mx-auto px-6 py-12">
<section aria-label="Learning Modules">
<div class="mb-8">
<h2 class="text-3xl font-bold text-gray-800">Modules</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 w-full">
<!-- Module Card: Grammar -->
<article class="w-full">
<a href="NivelesModulo.html?module=grammar" aria-label="Open Grammar Module, 75% complete" class="w-full relative overflow-hidden bg-gradient-to-br from-blue-50 to-blue-100/80 border border-blue-200/60 rounded-3xl p-10 shadow-sm hover:shadow-lg transition-all hover:-translate-y-1 duration-300 focus-ring text-left group min-h-[220px] flex flex-col justify-between">
<!-- Background decorative icon -->
<i class="fa-solid fa-book-open absolute -right-6 -bottom-6 text-9xl text-blue-500/5 rotate-[-10deg] pointer-events-none group-hover:scale-110 transition-transform duration-500"></i>
<div class="flex flex-col gap-8 relative z-10 w-full">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<span aria-hidden="true" class="text-4xl shadow-sm bg-white p-3 rounded-2xl">📖</span>
<h3 class="text-2xl font-bold text-slate-800 group-hover:text-blue-700 transition-colors">Grammar</h3>
</div>
<span class="text-blue-800/60 font-bold text-lg">75%</span>
</div>
<!-- Progress Bar -->
<div aria-hidden="true" class="h-3 w-full bg-blue-200/50 rounded-full overflow-hidden shadow-inner">
<div class="h-full bg-gradient-to-r from-blue-500 to-blue-400 rounded-full w-[75%] shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>
</div>
</div>
</a>
</article>
<!-- Module Card: Listening -->
<article class="w-full">
<a href="NivelesModulo.html?module=listening" aria-label="Open Listening Module, 58% complete" class="w-full relative overflow-hidden bg-gradient-to-br from-green-50 to-green-100/80 border border-green-200/60 rounded-3xl p-10 shadow-sm hover:shadow-lg transition-all hover:-translate-y-1 duration-300 focus-ring text-left group min-h-[220px] flex flex-col justify-between">
<!-- Background decorative icon -->
<i class="fa-solid fa-headphones absolute -right-6 -bottom-6 text-9xl text-green-500/5 rotate-[-10deg] pointer-events-none group-hover:scale-110 transition-transform duration-500"></i>
<div class="flex flex-col gap-8 relative z-10 w-full">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<span aria-hidden="true" class="text-4xl shadow-sm bg-white p-3 rounded-2xl">👂</span>
<h3 class="text-2xl font-bold text-slate-800 group-hover:text-green-700 transition-colors">Listening</h3>
</div>
<span class="text-green-800/60 font-bold text-lg">58%</span>
</div>
<!-- Progress Bar -->
<div aria-hidden="true" class="h-3 w-full bg-green-200/50 rounded-full overflow-hidden shadow-inner">
<div class="h-full bg-gradient-to-r from-green-500 to-green-400 rounded-full w-[58%] shadow-[0_0_10px_rgba(34,197,94,0.5)]"></div>
</div>
</div>
</a>
</article>
<!-- Module Card: Speaking -->
<article class="w-full">
<a href="NivelesModulo.html?module=speaking" aria-label="Open Speaking Module, 42% complete" class="w-full relative overflow-hidden bg-gradient-to-br from-orange-50 to-orange-100/80 border border-orange-200/60 rounded-3xl p-10 shadow-sm hover:shadow-lg transition-all hover:-translate-y-1 duration-300 focus-ring text-left group min-h-[220px] flex flex-col justify-between">
<!-- Background decorative icon -->
<i class="fa-solid fa-microphone absolute -right-6 -bottom-6 text-9xl text-orange-500/5 rotate-[-10deg] pointer-events-none group-hover:scale-110 transition-transform duration-500"></i>
<div class="flex flex-col gap-8 relative z-10 w-full">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<span aria-hidden="true" class="text-4xl shadow-sm bg-white p-3 rounded-2xl">🎤</span>
<h3 class="text-2xl font-bold text-slate-800 group-hover:text-orange-700 transition-colors">Speaking</h3>
</div>
<span class="text-orange-800/60 font-bold text-lg">42%</span>
</div>
<!-- Progress Bar -->
<div aria-hidden="true" class="h-3 w-full bg-orange-200/50 rounded-full overflow-hidden shadow-inner">
<div class="h-full bg-gradient-to-r from-orange-500 to-orange-400 rounded-full w-[42%] shadow-[0_0_10px_rgba(249,115,22,0.5)]"></div>
</div>
</div>
</a>
</article>
<!-- Module Card: Writing -->
<article class="w-full">
<a href="NivelesModulo.html?module=writting" aria-label="Open Writing Module, 30% complete" class="w-full relative overflow-hidden bg-gradient-to-br from-purple-50 to-purple-100/80 border border-purple-200/60 rounded-3xl p-10 shadow-sm hover:shadow-lg transition-all hover:-translate-y-1 duration-300 focus-ring text-left group min-h-[220px] flex flex-col justify-between">
<!-- Background decorative icon -->
<i class="fa-solid fa-pen-nib absolute -right-6 -bottom-6 text-9xl text-purple-500/5 rotate-[-10deg] pointer-events-none group-hover:scale-110 transition-transform duration-500"></i>
<div class="flex flex-col gap-8 relative z-10 w-full">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<span aria-hidden="true" class="text-4xl shadow-sm bg-white p-3 rounded-2xl">✍️</span>
<h3 class="text-2xl font-bold text-slate-800 group-hover:text-purple-700 transition-colors">Writting</h3>
</div>
<span class="text-purple-800/60 font-bold text-lg">30%</span>
</div>
<!-- Progress Bar -->
<div aria-hidden="true" class="h-3 w-full bg-purple-200/50 rounded-full overflow-hidden shadow-inner">
<div class="h-full bg-gradient-to-r from-purple-500 to-purple-400 rounded-full w-[30%] shadow-[0_0_10px_rgba(168,85,247,0.5)]"></div>
</div>
</div>
</a>
</article>
</div>
</section>
</main>
<!-- END: MainContent -->
</body></html>
